<text x="32" y="43" font-size="27" fill="#172b42" font-weight="bold" text-anchor="start">Does the generated data improve learning?</text><text x="32" y="74" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">PLANNED FIGURE · No downstream training comparisons have been run for this release sketch.</text><text x="40" y="131" font-size="23" fill="#172b42" font-weight="bold" text-anchor="start">General SFT transfer</text><text x="40" y="162" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">Per-task score by dataset arm</text><rect x="40" y="190" width="530" height="320" rx="12" fill="#f8fafc" stroke="#a6b7c7" stroke-width="2" stroke-dasharray="8 6"/><text x="305" y="328" font-size="22" fill="#52677d" font-weight="bold" text-anchor="middle">RESULTS NOT YET MEASURED</text><text x="305" y="364" font-size="17" fill="#52677d" font-weight="normal" text-anchor="middle">No points, bars or implied ordering</text><text x="630" y="131" font-size="23" fill="#172b42" font-weight="bold" text-anchor="start">Long-context transfer</text><text x="630" y="162" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">Per-task score by context length</text><rect x="630" y="190" width="530" height="320" rx="12" fill="#f8fafc" stroke="#a6b7c7" stroke-width="2" stroke-dasharray="8 6"/><text x="895" y="328" font-size="22" fill="#52677d" font-weight="bold" text-anchor="middle">RESULTS NOT YET MEASURED</text><text x="895" y="364" font-size="17" fill="#52677d" font-weight="normal" text-anchor="middle">No points, bars or implied ordering</text><text x="40" y="563" font-size="18" fill="#52677d" font-weight="normal" text-anchor="start">PLANNED · Fill only from frozen experiment artifacts; do not reuse published-model scores.</text><text x="40" y="592" font-size="18" fill="#52677d" font-weight="normal" text-anchor="start">Show all selected arms, paired-seed variation and task-level confidence intervals.</text><text x="40" y="621" font-size="18" 