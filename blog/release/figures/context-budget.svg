<svg xmlns="http://www.w3.org/2000/svg" width="980" height="745" viewBox="0 0 980 745" role="img" aria-labelledby="title desc">
<title id="title">Long input and long output spend the same budget</title><desc id="desc">Reconstruction uses substantial input and output space, while short-answer retrieval spends most of its sequence on context. Segment widths are illustrative.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#62798d"/></marker></defs>
<rect width="980" height="745" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="43" font-size="27" fill="#172b42" font-weight="bold" text-anchor="start">Long input and long output spend the same budget</text><text x="32" y="74" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">IMPLEMENTATION CONCEPT · Why input-length limits alone are insufficient.</text><text x="40" y="126" font-size="21" fill="#172b42" font-weight="normal" text-anchor="start">A training budget covers the complete serialized example, including its answer.</text><text x="40" y="157" font-size="21" fill="#172b42" font-weight="normal" text-anchor="start">The same maximum length can imply very different supervision.</text><text x="40" y="230" font-size="21" fill="#172b42" font-weight="bold" text-anchor="start">Untie reconstruction</text><rect x="40" y="256" width="80" height="66" fill="#fff0d5" stroke="#ffffff" stroke-width="3"/><text x="80.0" y="295" font-size="13" fill="#172b42" font-weight="normal" text-anchor="middle">Template</text><rect x="120" y="256" width="400" height="66" fill="#e6f0ff" stroke="#ffffff" stroke-width="3"/><text x="320.0" y="295" font-size="18" fill="#172b42" font-weight="normal" text-anchor="middle">Shuffled source</text><rect x="520" y="256" width="400" height="66" fill="#e1f4ee" stroke="#ffffff" stroke-width="3"/><text x="720.0" y="295" font-size="18" fill="#172b42" font-weight="normal" text-anchor="middle">Reconstructed text</text><text x="40" y="352" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">Complete serialized record ≤ configured token limit</text><text x="40" y="407" font-size="21" fill="#172b42" font-weight="bold" text-anchor="start">Short-answer retrieval / abstention</text><rect x="40" y="433" width="80" height="66" fill="#fff0d5" stroke="#ffffff" stroke-width="3"/><text x="80.0" y="472" font-size="13" fill="#172b42" font-weight="normal" text-anchor="middle">Template</text><rect x="120" y="433" width="690" height="66" fill="#e6f0ff" stroke="#ffffff" stroke-width="3"/><text x="465.0" y="472" font-size="18" fill="#172b42" font-weight="normal" text-anchor="middle">Long context + query</text><rect x="810" y="433" width="110" height="66" fill="#e1f4ee" stroke="#ffffff" stroke-width="3"/><text x="865.0" y="472" font-size="13" fill="#172b42" font-weight="normal" text-anchor="middle">Answer</text><text x="40" y="529" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">Complete serialized record ≤ configured token limit</text><text x="40" y="590" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">ILLUSTRATIVE · Segment widths are conceptual, not measurements or fixed ratios.</text><text x="40" y="618" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">Count with the intended tokenizer and training chat template.</text><text x="40" y="646" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">PT text and SFT messages can have different measured lengths.</text><text x="40" y="674" font-size="17" fill="#52677d" font-weight="normal" text-anchor="start">128K smoke coverage established serialization fit, not 128K model understanding.</text></g></svg>