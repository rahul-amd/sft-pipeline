<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
<title id="title">Three claims need three kinds of evidence</title><desc id="desc">Three independent claims require integration tests, held-out human labels and controlled downstream student comparisons respectively.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#62798d"/></marker></defs>
<rect width="1180" height="680" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="43" font-size="27" fill="#172b42" font-weight="bold" text-anchor="start">Three claims need three kinds of evidence</text><text x="32" y="74" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">EVIDENCE DESIGN · Read each result at the scope it actually tests.</text><text x="35" y="139" font-size="22" fill="#172b42" font-weight="bold" text-anchor="start">1 · Does it run?</text><rect x="35" y="162" width="350" height="164" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="53" y="190" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Integrity and recovery</text><text x="53" y="214" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">IDs, joins, token budgets</text><text x="53" y="238" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Real API and sandbox paths</text><text x="53" y="262" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Evidence: integration tests</text><text x="415" y="139" font-size="22" fill="#172b42" font-weight="bold" text-anchor="start">2 · Is supervision sound?</text><rect x="415" y="162" width="350" height="164" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="433" y="190" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Human-reviewed examples</text><text x="433" y="214" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Support, correctness, coverage</text><text x="433" y="238" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Judge calibration + uncertainty</text><text x="433" y="262" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Evidence: held-out labels</text><text x="795" y="139" font-size="22" fill="#172b42" font-weight="bold" text-anchor="start">3 · Does a student improve?</text><rect x="795" y="162" width="350" height="164" rx="12" fill="#fff0d5" stroke="#bbcad8"/><text x="813" y="190" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Matched training comparison</text><text x="813" y="214" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Same base and token budget</text><text x="813" y="238" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Paired seeds; held-out tasks</text><text x="813" y="262" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Evidence: downstream results</text><rect x="35" y="382" width="1110" height="113" rx="12" fill="#f2f5f8" stroke="#bbcad8"/><text x="53" y="410" font-size="18" fill="#172b42" font-weight="normal" text-anchor="start">Controls shared across proposed comparisons</text><text x="53" y="434" font-size="18" fill="#172b42" font-weight="normal" text-anchor="start">Freeze source splits, templates, model versions, serialization and evaluation before running.</text><text x="53" y="458" font-size="18" fill="#172b42" font-weight="normal" text-anchor="start">Separate public-dataset comparisons from internal causal ablations.</text><text x="35" y="548" font-size="19" fill="#52677d" font-weight="normal" text-anchor="start">MEASURED: software integration evidence exists for particular configurations.</text><text x="35" y="580" font-size="19" fill="#52677d" font-weight="normal" text-anchor="start">PROPOSED: representative human quality estimates and controlled student comparisons.</text><text x="35" y="612" font-size="19" fill="#52677d" font-weight="normal" text-anchor="start">A passing test suite does not supply the missing quality or learning evidence.</text></g></svg>