<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="916" viewBox="0 0 1250 916" role="img" aria-labelledby="title desc">
<title id="title">Two repositories, two complementary data recipes</title><desc id="desc">Left: SFT collection and source generation converge before decontamination, embedding, selection, inference and filtering. Right: deterministic synthetic, deterministic corpus and model-authored corpus generators emit separate PT or SFT datasets.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#62798d"/></marker></defs>
<rect width="1250" height="916" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="43" font-size="27" fill="#172b42" font-weight="bold" text-anchor="start">Two repositories, two complementary data recipes</text><text x="32" y="74" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">IMPLEMENTATION DIAGRAM · Paths describe the frozen code; output quality requires separate evaluation.</text><text x="38" y="120" font-size="19" fill="#172b42" font-weight="bold" text-anchor="start">SFT: curate the question, then author the answer</text><rect x="38" y="141" width="250" height="72" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="169" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">1 · Collect prompts</text><text x="56" y="193" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">Normalize; exact dedup</text><rect x="308" y="141" width="270" height="72" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="326" y="169" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">2 · Generate from sources</text><text x="326" y="193" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">Grounding + evidence</text><path d="M163 213 L163 237" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M443 213 L443 237" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M163 237 L443 237 M303 237 L303 256" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="260" width="540" height="68" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="288" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Configured benchmark decontamination</text><path d="M303 328 L303 348" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="353" width="540" height="68" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="381" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">3 · Embed → cluster → annotate</text><path d="M303 421 L303 441" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="446" width="540" height="72" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="474" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">4 · Quota selection</text><text x="56" y="498" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Optional semantic dedup: default off</text><path d="M303 518 L303 538" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="543" width="540" height="72" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="571" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">5 · Teacher inference</text><text x="56" y="595" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">OpenAI-compatible API</text><path d="M303 615 L303 635" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="640" width="540" height="82" rx="12" fill="#e6f0ff" stroke="#bbcad8"/><text x="56" y="668" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">6 · Structural checks, code checks, judge</text><text x="56" y="692" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Judge sampling is configurable</text><path d="M303 722 L303 742" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="38" y="747" width="540" height="62" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="56" y="775" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Final SFT JSONL export</text><text x="38" y="846" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">Evidence and decisions stay in audit artifacts.</text><text x="38" y="870" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">Large runs may export/import external inference.</text><text x="638" y="120" font-size="19" fill="#172b42" font-weight="bold" text-anchor="start">LC: construct distinct long-context tasks</text><rect x="638" y="141" width="550" height="76" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="656" y="169" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Synthetic task definitions</text><text x="656" y="193" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">RULER++: 22 deterministic tasks</text><rect x="638" y="245" width="550" height="76" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="656" y="273" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Quality-filtered source documents</text><text x="656" y="297" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Single docs, passage pools, or embedding clusters</text><path d="M913 321 L913 348" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="638" y="353" width="550" height="95" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="656" y="381" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Deterministic corpus tasks</text><text x="656" y="405" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Untie: reconstruction / permutation</text><text x="656" y="429" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">MRCR: retrieval · IDK: answer / abstain</text><rect x="638" y="478" width="550" height="120" rx="12" fill="#fff0d5" stroke="#bbcad8"/><text x="656" y="506" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">Model-authored corpus tasks</text><text x="656" y="530" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">QA: sampled chunks → request → assemble</text><text x="656" y="554" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">Summary: whole document → request → assemble</text><text x="656" y="578" font-size="16" fill="#172b42" font-weight="normal" text-anchor="start">Inference: built-in API or external engine</text><path d="M1188 283 L1210 283 L1210 538 L1194 538" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="638" y="653" width="550" height="95" rx="12" fill="#e1f4ee" stroke="#bbcad8"/><text x="656" y="681" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Per-generator PT text or SFT messages</text><text x="656" y="705" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Complete-record length checks</text><text x="656" y="729" font-size="17" fill="#172b42" font-weight="normal" text-anchor="start">Deterministic golds or model-generated answers</text><path d="M638 181 L613 181 L613 700 L632 700" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M638 403 L624 403 L624 677 L632 677" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M913 598 L913 648" stroke="#62798d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="638" y="793" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">Clustering supports Untie clustered sources;</text><text x="638" y="817" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">it is not required by every corpus task.</text><text x="638" y="841" font-size="16" fill="#52677d" font-weight="normal" text-anchor="start">No shared SFT–LC training merger is implied.</text></g></svg>